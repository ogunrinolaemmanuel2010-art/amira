<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./a.css">
    <title>AMIRA GOLD | Order Request</title>
</head>

<body>
    <main class="container">
        <header class="gold">
            <p class="brand-tag">Premium Jewelry Services</p>
            <h1>AMIRA GOLD</h1>
            <p class="subtitle">Request your preferred gold piece and our team will contact you with details.</p>
        </header>

        <form action="./success.html" method="get" class="order-form">
            <div class="input">
                <label for="full_name">Full name</label>
                <input id="full_name" name="full_name" type="text" placeholder="Enter your full name" required>
            </div>

            <div class="input">
                <label for="email">Email address</label>
                <input id="email" name="email" type="email" placeholder="Enter your email address" required>
            </div>

            <div class="input">
                <label for="phone_number">Phone number</label>
                <div class="phone-row">
                    <select name="country_code" aria-label="Country code">
                        <option value="+1">United States (+1)</option>
                        <option value="+44">United Kingdom (+44)</option>
                        <option value="+234">Nigeria (+234)</option>
                        <option value="+91">India (+91)</option>
                        <option value="+64">New Zealand (+64)</option>
                        <option value="+61">Australia (+61)</option>
                        <option value="+27">South Africa (+27)</option>
                        <option value="+233">Ghana (+233)</option>
                    </select>
                    <input id="phone_number" type="tel" name="phone_number" inputmode="tel" placeholder="Phone number"
                        required>
                </div>
            </div>

            <div class="input">
                <label for="gold_type">Gold type</label>
                <select name="gold_type" id="gold_type" required>
                    <option value="" selected disabled>Select an item</option>
                    <option value="Necklace">Necklace</option>
                    <option value="Ring">Ring</option>
                    <option value="Bracelet">Bracelet</option>
                    <option value="Wrist Watch">Wrist watch</option>
                </select>
            </div>

            <div class="input">
                <label for="grams">Weight (grams)</label>
                <input id="grams" name="grams" type="number" min="1" step="0.1" placeholder="e.g. 25.5" required>
            </div>

            <div class="input">
                <label for="description">Description</label>
                <textarea name="description" id="description" rows="4"
                    placeholder="Add details about your request"></textarea>
            </div>

            <div class="input">
                <button type="submit">Submit Request</button>
            </div>
        </form>
    </main>
</body>

</html>
